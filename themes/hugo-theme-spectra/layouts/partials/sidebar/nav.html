<nav class="sidebar-nav">
  <div class="sidebar-nav-label">{{ i18n "nav_label" }}</div>
  {{ if ne site.Params.enableSearch false }}
  <button id="searchTrigger" data-tooltip="{{ i18n "search" }}" aria-label="{{ i18n "search" }}">
    <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="7.5" r="5.5"/><line x1="11.5" y1="11.5" x2="16" y2="16"/></svg></span>
    <span class="nav-text">{{ i18n "search" }}</span>
  </button>
  {{ end }}
  {{ range .Site.Menus.main }}
    <a href="{{ with .Page }}{{ .RelPermalink }}{{ else }}{{ site.Home.RelPermalink }}{{ strings.TrimPrefix "/" .PageRef }}{{ end }}" data-tooltip="{{ .Name }}" {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}class="active" aria-current="page"{{ end }}>
      {{ with .Pre }}<span class="nav-icon">{{ . }}</span>{{ end }}
      <span class="nav-text">{{ .Name }}</span>
    </a>
  {{ end }}
</nav>
