<div class="search-overlay" id="searchOverlay" data-index="{{ "index.json" | relLangURL }}" role="dialog" aria-modal="true" aria-label="{{ i18n "search" }}">
  <div class="search-container">
    <div class="search-header">
      <div class="search-input-wrapper">
        <svg class="search-input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="7.5" cy="7.5" r="5.5"/>
          <line x1="11.5" y1="11.5" x2="16" y2="16"/>
        </svg>
        <input type="text" class="search-input" id="searchInput" placeholder="{{ i18n "search_placeholder" }}" autocomplete="off">
      </div>
      <button class="search-close" id="searchClose" aria-label="{{ i18n "search_close" }}">
        <kbd>ESC</kbd>
      </button>
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-empty" id="searchEmpty">{{ i18n "search_hint" }}</div>
    </div>
  </div>
</div>
