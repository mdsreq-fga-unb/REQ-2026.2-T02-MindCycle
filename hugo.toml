# =====================================================================
#  MindCycle — Documentação do Produto e do Projeto
#  Disciplina: Requisitos de Software (REQ) — 2026.2 — Turma 02
#  Tema: Spectra (https://github.com/JoeYang1412/hugo-theme-spectra)
# =====================================================================

baseURL              = 'https://mdsreq-fga-unb.github.io/REQ-2026.2-T02-MindCycle/'
locale               = 'pt-BR'
defaultContentLanguage = 'pt-br'
title                = 'MindCycle'
theme                = 'hugo-theme-spectra'
enableGitInfo        = false
enableRobotsTXT      = true

# Documentação não é blog: sem taxonomias, sem feed de posts.
disableKinds = ['taxonomy', 'term', 'rss']

[outputs]
  home = ['HTML', 'JSON']

[params]
  # ---------------------------------------------------------------
  #  Identidade
  # ---------------------------------------------------------------
  author      = 'Equipe MindCycle'
  tagline     = '// REQ 2026.2 · T02'
  description = 'Documentação do produto e do projeto MindCycle — aplicativo de organização de tarefas adaptado ao ciclo menstrual, desenvolvido para o LabLivre/FCTE-UnB.'
  bio         = 'Documento de Visão do Produto e Projeto e entregas da disciplina de Requisitos de Software.'

  # ---------------------------------------------------------------
  #  Marca — arquivos vindos de assets/brand/ (branch main)
  #  Caminhos relativos a assets/. Trocar aqui troca em todo o site.
  # ---------------------------------------------------------------
  logoIcone           = 'brand/logo/icon-lua/lua-original_transparente.svg'
  logoWordmark        = 'brand/logo/wordmark/mindcycle-wordmark_transparente.svg'
  logoWordmarkEscuro  = 'img/marca/wordmark-escuro-sem-fundo.svg'
  favicon             = '/img/favicon.svg'

  # ---------------------------------------------------------------
  #  Recursos do tema
  #
  #  O Spectra é um tema de blog com estética "sci-fi": tela de
  #  carregamento, brilho que segue o mouse, partículas, banner com
  #  parallax e animações de entrada por scroll. Nada disso serve a uma
  #  documentação acadêmica e tudo isso custa JavaScript. Está desligado.
  #  A paleta, a tipografia e o enquadramento visual estão em
  #  static/css/custom.css.
  # ---------------------------------------------------------------
  math                   = false
  share                  = false
  imageOptimize          = true
  enableLoadingAnimation = false
  enableMouseGlow        = false
  showBanner             = false
  showReadingProgress    = false
  enableScrollAnimation  = false
  enableCodeCopy         = false
  showRelatedPosts       = false
  showSeriesNav          = false
  enableLightbox         = true
  showScrollTop          = true
  enableSearch           = true


  # A barra lateral é um sumário de documentação: sem blog, tags ou recentes.
  [params.sidebar]
    showAllPosts  = false
    showCategories = false
    showTags      = false
    showRecent    = false

  # ---------------------------------------------------------------
  #  Links do rodapé da barra lateral
  # ---------------------------------------------------------------
  [[params.social]]
    name = 'GitHub'
    url  = 'https://github.com/mdsreq-fga-unb/REQ-2026.2-T02-MindCycle'

# =====================================================================
#  Menu de navegação (sumário da documentação)
#
#  O sumário segue as unidades da disciplina: cada unidade agrupa as
#  seções do Documento de Visão entregues nela. Só entra no menu o que já
#  foi entregue — seção ainda não escrita não ganha entrada vazia. As
#  páginas continuam em content/visao/, então os endereços e os links
#  entre seções não mudam.
#
#  Os cabeçalhos de unidade e de fase não têm pageRef: são apenas rótulos que
#  recolhem e expandem o grupo (ver layouts/partials/sidebar/nav.html).
# =====================================================================

[[menus.main]]
  identifier = 'inicio'
  name       = 'Início'
  pageRef    = '/'
  weight     = 1
  pre        = '⌂'

