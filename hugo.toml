# =====================================================================
#  Markdown / render
# =====================================================================
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
  [markup.highlight]
    guessSyntax = true
    noClasses   = false
    lineNos     = false

# O embed do YouTube usa youtube-nocookie.com: nenhum cookie de
# rastreamento antes de a leitora dar play.
[privacy]
  [privacy.youtube]
    privacyEnhanced = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'
