# =====================================================================
#  Markdown / render
# =====================================================================
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
  [markup.highlight]
    guessSyntax = true
    noClasses   = false
    lineNos     = false

[caches]
  [caches.images]
    dir = ':cacheDir/images'
