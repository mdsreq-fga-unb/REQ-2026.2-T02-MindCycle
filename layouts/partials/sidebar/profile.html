{{/*
  Cabeçalho do sumário: ícone da lua (assets/brand/logo/icon-lua) e o nome do
  produto. Substitui o "perfil de autor" do tema.
*/}}
{{- $icone := resources.Get site.Params.logoIcone -}}
<a class="sidebar-brand" href="{{ site.Home.RelPermalink }}">
  {{ with $icone }}
  <span class="sidebar-brand-mark">
    <img src="{{ .RelPermalink }}" alt="" width="34" height="34" loading="eager" decoding="async">
  </span>
  {{ end }}
  <span class="sidebar-brand-text">
    <span class="sidebar-brand-name">{{ site.Title }}</span>
    <span class="sidebar-brand-sub">{{ site.Params.tagline }}</span>
  </span>
</a>
