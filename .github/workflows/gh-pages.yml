name: Publicar no GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Token que lê o quadro kanban (GitHub Project, privado). Ver o README.
      KANBAN_TOKEN: ${{ secrets.KANBAN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # O retrato do quadro da página Entregas e cronograma é refeito a cada
      # publicação. Sem o segredo, ou se a leitura falhar, vai o retrato que
      # está no repositório e a publicação segue normalmente.
      - name: Atualizar o retrato do quadro kanban
        if: env.KANBAN_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.KANBAN_TOKEN }}
        run: python3 .github/scripts/atualizar_kanban.py

      - name: Avisar que o quadro não foi atualizado
        if: env.KANBAN_TOKEN == ''
        run: echo "::notice::Sem o segredo KANBAN_TOKEN, o quadro kanban vai com o retrato do repositório."

      # `enablement: true` liga o GitHub Pages na primeira execução, usando o
      # GITHUB_TOKEN (permissão `pages: write` acima). Sem isso a ação falha
      # com "Get Pages site failed" enquanto ninguém tiver ido em
      # Settings > Pages > Source: GitHub Actions.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é HTML, CSS e JavaScript puros: não há build. Só os arquivos
      # do site são publicados — README, workflows e configurações do
      # repositório ficam de fora.
      - name: Separar os arquivos do site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
