name: Publicar no GitHub Pages

on:
  push:
    branches: [gh-pages, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # O tema Spectra exige Hugo extended >= 0.157.0
  HUGO_VERSION: 0.165.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          set -euo pipefail
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      # O tema usa apenas @import no SCSS, compilado pelo libsass embutido no
      # Hugo extended. Não é necessário instalar o Dart Sass.

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Construir o site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Sao_Paulo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
