name: Publicar no GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `enablement: true` liga o GitHub Pages na primeira execução, usando o
      # GITHUB_TOKEN (permissão `pages: write` acima). Sem isso a ação falha
      # com "Get Pages site failed" enquanto ninguém tiver ido em
      # Settings > Pages > Source: GitHub Actions.
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # O site é HTML, CSS e JavaScript puros: não há build. Só os arquivos
      # do site são publicados — README, workflows e configurações do
      # repositório ficam de fora.
      - name: Separar os arquivos do site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git*' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'README.md' \
            ./ _site/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
